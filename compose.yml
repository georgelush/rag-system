services:

  rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-example
    ports:
      - "8080:8080"
    environment:
      RAG_API_KEY: ${RAG_API_KEY}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      LLM_PROXY: ${LLM_PROXY}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.4-nano}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      RATE_LIMIT_QUERY: ${RATE_LIMIT_QUERY:-60}
      RATE_LIMIT_INGEST: ${RATE_LIMIT_INGEST:-20}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-120}
      RAG_VERSION: "1.0.0"
      RERANKER_URL: ${RERANKER_URL:-http://reranker:8090}
      RBAC_ENABLED: ${RBAC_ENABLED:-false}
      RBAC_SECRET: ${RBAC_SECRET:-}
    depends_on:
      - qdrant
      - redis
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python rag/worker.py
    environment:
      RAG_API_KEY: ${RAG_API_KEY}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      LLM_PROXY: ${LLM_PROXY}
      LLM_API_KEY: ${LLM_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    depends_on:
      - qdrant
      - redis
    restart: unless-stopped

  reranker:
    build:
      context: ./reranker
      dockerfile: Dockerfile
    container_name: rag-example-reranker
    ports:
      - "8090:8090"
    environment:
      RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      RERANKER_PORT: "8090"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.9.7
    container_name: rag-example-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: rag-example-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  qdrant-data:
    driver: local
  redis-data:
    driver: local
